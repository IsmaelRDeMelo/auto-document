name: Deploy Agent — Auto-Document on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "migrations/**"
      - "models/**"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Run tests — always required
  # ------------------------------------------------------------------
  test:
    name: Validate scripts (coverage ≥ 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install msal requests python-dotenv pytest pytest-cov pytest-mock

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --cov=.github/skills/data-deploy/scripts \
            --cov-fail-under=90 \
            -q

  # ------------------------------------------------------------------
  # Job 2: Generate & publish deploy doc — only on Jira-style branches
  # ------------------------------------------------------------------
  deploy-doc:
    name: Generate deploy document
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for git diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install msal requests python-dotenv

      # ----------------------------------------------------------------
      # Step 1 — Extract Jira ID from branch name
      # ----------------------------------------------------------------
      - name: Extract Jira ID
        id: jira
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          JIRA_ID=$(echo "$BRANCH" | grep -oP '[A-Z]+-[0-9]+' | head -1)
          if [ -z "$JIRA_ID" ]; then
            echo "::warning::Branch '$BRANCH' does not contain a Jira ID — skipping deploy doc generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Jira ID: $JIRA_ID"
            echo "jira_id=$JIRA_ID"  >> "$GITHUB_OUTPUT"
            echo "skip=false"        >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------
      # Step 2 — Read the diff between this PR and main
      # ----------------------------------------------------------------
      - name: Get git diff
        if: steps.jira.outputs.skip == 'false'
        run: |
          git diff origin/main...HEAD > /tmp/pr_diff.txt
          echo "=== Diff summary ==="
          git diff origin/main...HEAD --stat

      # ----------------------------------------------------------------
      # Step 3 — Fill deploy document from template
      # ----------------------------------------------------------------
      - name: Fill deploy document
        if: steps.jira.outputs.skip == 'false'
        env:
          JIRA_ID: ${{ steps.jira.outputs.jira_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python - <<'EOF'
          import os, datetime, re, pathlib

          jira_id  = os.environ["JIRA_ID"]
          pr_url   = os.environ["PR_URL"]
          now      = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          diff = pathlib.Path("/tmp/pr_diff.txt").read_text(encoding="utf-8")

          # Classify changed files
          snowflake = [l for l in diff.splitlines() if re.search(r'\+\+\+ b/migrations/', l)]
          dbt       = [l for l in diff.splitlines() if re.search(r'\+\+\+ b/models/', l)]

          snowflake_list = "\n".join(f"- `{p.replace('+++ b/', '')}`" for p in snowflake) or "_None_"
          dbt_list       = "\n".join(f"- `{p.replace('+++ b/', '')}`" for p in dbt)       or "_None_"

          # Basic validations
          drop_check    = "FAIL" if re.search(r'\bDROP\b', diff, re.I) else "PASS"
          drop_detail   = "Unprotected DROP detected — review required" if drop_check == "FAIL" else "No DROP statements found"
          naming_check  = "PASS"
          naming_detail = "Manual review recommended"
          schema_check  = "PASS" if any("schema.yml" in p for p in dbt) else "FAIL"
          schema_detail = "schema.yml present" if schema_check == "PASS" else "No schema.yml found for new model"
          tests_check   = "PASS" if re.search(r'not_null|unique', diff) else "FAIL"
          tests_detail  = "Tests present" if tests_check == "PASS" else "Missing not_null/unique tests"

          risk = "Low" if drop_check == "PASS" else "High"
          rollback = (
            f"Run `UNDROP TABLE` for any Snowflake objects. "
            f"For dbt, revert the PR and run `dbt run --select revenue_kpi_summary`."
          )

          template = pathlib.Path(".github/skills/data-deploy/template_deploy.md").read_text()
          filled = (template
            .replace("{{ jira_id }}", jira_id)
            .replace("{{ summary }}", f"Automated deploy document for {jira_id}. See diff for full details.")
            .replace("{{ snowflake_changes }}", snowflake_list)
            .replace("{{ dbt_changes }}", dbt_list)
            .replace("{{ drop_check }}", drop_check)
            .replace("{{ drop_detail }}", drop_detail)
            .replace("{{ naming_check }}", naming_check)
            .replace("{{ naming_detail }}", naming_detail)
            .replace("{{ schema_check }}", schema_check)
            .replace("{{ schema_detail }}", schema_detail)
            .replace("{{ tests_check }}", tests_check)
            .replace("{{ tests_detail }}", tests_detail)
            .replace("{{ risk_assessment }}", f"{risk} — automated assessment")
            .replace("{{ rollback_plan }}", rollback)
            .replace("{{ generated_at }}", now)
            .replace("{{ pr_url }}", pr_url)
          )

          pathlib.Path("/tmp/deploy_doc.md").write_text(filled, encoding="utf-8")
          print("Deploy document generated:")
          print(filled[:500])
          EOF

      # ----------------------------------------------------------------
      # Step 4 — Upload to SharePoint (idempotent)
      # ----------------------------------------------------------------
      - name: Upload to SharePoint
        if: steps.jira.outputs.skip == 'false'
        id: sharepoint
        env:
          MS_GRAPH_TENANT_ID:     ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID:     ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID:     ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID:    ${{ secrets.SHAREPOINT_DRIVE_ID }}
        run: |
          SP_URL=$(python .github/skills/data-deploy/scripts/sharepoint_tool.py \
            "${{ github.head_ref }}" /tmp/deploy_doc.md)
          echo "sharepoint_url=$SP_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded: $SP_URL"

      # ----------------------------------------------------------------
      # Step 5 — Update Jira ticket (idempotent)
      # ----------------------------------------------------------------
      - name: Update Jira ticket
        if: steps.jira.outputs.skip == 'false'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
        run: |
          python .github/skills/data-deploy/scripts/jira_tool.py \
            "${{ steps.jira.outputs.jira_id }}" \
            "${{ steps.sharepoint.outputs.sharepoint_url }}"
