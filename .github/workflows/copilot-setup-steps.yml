# Copilot Setup Steps
# This workflow preinstalls tools and dependencies in Copilot's ephemeral
# development environment BEFORE the agent starts working on a task.
# See: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment

name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python dependencies for agent skill scripts
        run: pip install msal requests python-dotenv

      - name: Install test dependencies
        run: pip install pytest pytest-cov pytest-mock

      - name: Run tests to validate skill scripts
        run: python -m pytest tests/ --cov=.github/skills/data-deploy/scripts --cov-fail-under=90 -q
